<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE mapper PUBLIC "-//mybatis.org//DTD Mapper 3.0//EN" "http://mybatis.org/dtd/mybatis-3-mapper.dtd">
<mapper namespace="recording_time_window">

<insert id="time_window_insert">
INSERT INTO recording_time_windows (
    policy_id, start_time, end_time, days
) VALUES (
    #{policy_id}, #{start_time}, #{end_time}, #{days}::int[]
)
</insert>

<delete id="time_window_delete_by_policy_id">
DELETE FROM recording_time_windows WHERE policy_id = #{policy_id}
</delete>

<delete id="time_window_delete_by_id">
DELETE FROM recording_time_windows WHERE id = #{id}
</delete>

<select id="time_window_select_by_policy_id">
SELECT id, policy_id, start_time, end_time, days
FROM recording_time_windows
WHERE policy_id = #{policy_id}
</select>

</mapper>
