<mapper>
<select id="map_settings_select">
SELECT id, browser_layers, client_layers, wfs, updated_at
FROM map_settings
WHERE id = 1
</select>

<insert id="map_settings_upsert">
INSERT INTO map_settings (id, browser_layers, client_layers, wfs)
VALUES (1, #{browser_layers}::jsonb, #{client_layers}::jsonb, #{wfs}::jsonb)
ON CONFLICT (id) DO UPDATE SET
browser_layers = #{browser_layers}::jsonb,
client_layers = #{client_layers}::jsonb,
wfs = #{wfs}::jsonb,
updated_at = now()
</insert>
</mapper>
