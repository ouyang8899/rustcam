[workspace]
resolver = "2"
members = [
    "crates/rustcam-media",
    "crates/rustcam-server",
    "crates/rustcam-drone-proto",
    "crates/rustcam-drone-core",
    "crates/rustcam-drone-service",
    "crates/rustcam-drone-adapter",
    "crates/rustcam-drone-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ouyang"]

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "macros", "tokio", "http1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.3", features = ["json", "query"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
rbatis = { version = "4.9.8", features = ["debug_mode"] }
rbdc-pg = "4.9.6"
rbdc = "4.9.10"
bb8 = "0.9.1"
rbs = "4"
url = "2"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15.27"
futures = "0.3.34"
futures-util = "0.3"
futures-core = "0.3"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
rustls = { version = "0.23.46", features = ["ring"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26.6"
ring = "0.17"
parking_lot = "0.13.0"
dashmap = "6.2.1"
once_cell = "1.19"
toml = "1.1.8+spec-1.1.0"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
rand_core = "0.10"
getrandom = "0.4.3"
bytes = "1.12.1"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
casbin = "2"
argon2 = "0.6.0"
password-hash = { version = "0.6", features = ["rand_core", "phc"] }
async-trait = "0.1.92"
regex = "1.13.1"
tokio-util = "0.7.20"
rubato = "5.0.1"
rsip = "0.4"
quick-xml = "0.42.0"
roxmltree = "0.21.2"
memchr = "2.8.3"
sha1 = "0.11.0"
cron = "0.17.0"
base64 = "0.23.1"
md5 = "0.8.1"
tokio-test = "0.4.6"
mockall = "0.15.0"

# drone 相关：gRPC 契约与服务
tonic = "0.14.9"
prost = "0.14.4"
prost-types = "0.14.4"
tokio-stream = "0.1"
tonic-build = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost-build = "0.14.4"
# 围栏几何判定（drone-service）
geo = "0.33.1"
geo-types = "0.7"
geojson = "1.0.0"
mavlink = { version = "0.21", default-features = false, features = [
    "std",
    "tokio",
    "transport-udp",
    "transport-tcp",
    "transport-direct-serial",
    "dialect-common",
    "dialect-ardupilotmega",
] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
