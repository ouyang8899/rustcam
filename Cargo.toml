[package]
name = "rustcam-media"
version = "0.1.0"
edition = "2021"
authors = ["RustCam Team"]
description = "Streaming media signaling management platform"

[lib]
name = "rustcam_media"
path = "src/lib.rs"

[[bin]]
name = "rustcam-media"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.0", features = ["full"] }
axum = { version = "0.8.9", features = [
    "ws",       # WebSocket 支持
    "macros",   # debug_handler 等宏
    "tokio",    # tokio 运行时集成（必须！）
    "http1",    # HTTP/1.1 支持
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.3", features = ["json", "query"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
rbatis = { version = "4.9.8", features = ["debug_mode"] }
rbdc-pg = "4.9.6"
bb8 = "0.9.1"
rbs = "4"
url = "2"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15.27"
futures-util = "0.3"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
rustls = { version = "0.23.46", features = ["ring"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26.6"
parking_lot = "0.13.0"
dashmap = "6.2.1"
once_cell = "1.19"
toml = "1.1.8+spec-1.1.0"
futures = "0.3.34"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
rand_core = "0.10"
getrandom = "0.4.3"
bytes = "1.12.1"

# JWT 认证
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

# Casbin 权限
casbin = "2"

# 密码哈希
argon2 = "0.6.0"
password-hash = { version = "0.6", features = ["rand_core", "phc"] }

# 异步 trait
async-trait = "0.1.92"

# Regex for protocol matching
regex = "1.13.1"
tokio-util = "0.7.20"

# Audio resampling
rubato = "5.0.1"

# SIP parsing
rsip = "0.4"

# XML parsing
quick-xml = "0.42.0"
roxmltree = "0.21.1"
memchr = "2.8.3"
sha1 = "0.11.0"

# Cron expression parsing
cron = "0.17.0"
base64 = "0.23.1"
md5 = "0.8.1"
rbdc = "4.9.10"
futures-core = "0.3"

[dev-dependencies]
tokio-test = "0.4.6"
mockall = "0.15.0"
[profile.dev]
opt-level = 0          # 禁止优化
debug = true           # 启用调试信息 (通常默认为 true)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
