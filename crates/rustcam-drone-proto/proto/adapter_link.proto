syntax = "proto3";
package drone.v1.link;

import "common.proto";

service AdapterLink {
  // 注意：RPC 不能命名为 Connect —— tonic 会为客户端生成同名 connect(dst) 构造器，
  // 导致重复定义（E0592）。这里用 Open 表示"打开会话"。
  rpc Open (stream AdapterMessage) returns (stream ServiceMessage);
}

message AdapterMessage {
  oneof payload {
    Register            register        = 1;
    Heartbeat           heartbeat       = 2;
    common.Telemetry    telemetry       = 3;
    common.CommandReply command_reply   = 4;
    common.DeviceEvent  event           = 5;
    IdentityReport      identity_report = 6;  // 建链后上报实测唯一标识
  }
}

message ServiceMessage {
  oneof payload {
    RegisterAck  register_ack  = 1;
    common.Command command     = 2;
    ControlState control_state = 3;
  }
}

message Register {
  string adapter_id = 1;
  string protocol   = 2;
  string version    = 3;
}

message DeviceIdentity {
  string drone_tag = 1;    // adapter 侧本地设备 ID
  string unique_id = 2;    // 该设备对应飞控的唯一标识；空 = 未读到
}

message IdentityReport {
  repeated DeviceIdentity identities = 1;  // adapter 建链后实测的飞控唯一标识
}

message DeviceAssignment {
  string drone_tag = 1;      // 服务端分配给本 adapter 的设备 ID
  string mavlink_addr = 2;   // 该机的 MAVLink 端点（隧道内地址）
  string signing_secret = 3; // 该机的 MAVLink 2 签名密钥（32 字节 hex）；空 = 不启用签名
  bool allow_unsigned = 4;   // 是否放行未签名帧（含 MAVLink 1 帧）；仅在有密钥时生效
  int32 mavlink_version = 5; // 该机的 MAVLink 协议版本：1 / 2；adapter 按此固定收发版本
  int32 mavlink_sysid = 6;   // 该机的 system id；adapter 用作出站 target_system
  int32 mavlink_compid = 7;  // 该机的 component id；adapter 用作出站 target_component
}

message RegisterAck {
  bool accepted = 1;
  string reason = 2;
  repeated string assigned_drone_tags = 3;
  int32 heartbeat_interval_sec = 4;
  repeated DeviceAssignment assignments = 5;  // 每设备的端点与密钥；与 assigned_drone_tags 同序
}

message Heartbeat {
  int64 ts_ms = 1;
  int32 device_count = 2;
  int32 inflight_commands = 3;
  string adapter_state = 4;
}

message ControlState {
  string drone_tag = 1;
  string control_type = 2;
  string holder = 3;
  int32  priority = 4;
  int64  expire_at_ms = 5;
  string action = 6;
}
