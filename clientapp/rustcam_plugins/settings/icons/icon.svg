<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中心圈变得极小：r="6" -->
    <mask id="holeMask">
      <rect width="100" height="100" fill="white" />
      <circle cx="50" cy="50" r="6" fill="black" />
    </mask>
  </defs>

  <g fill="#25a14e" mask="url(#holeMask)">
    <!-- 齿轮的6个齿：向外拉长 (高度为26)，并变窄 (宽度为12) -->
    <rect x="44" y="8" width="12" height="26" rx="3" transform="rotate(0 50 50)" />
    <rect x="44" y="8" width="12" height="26" rx="3" transform="rotate(60 50 50)" />
    <rect x="44" y="8" width="12" height="26" rx="3" transform="rotate(120 50 50)" />
    <rect x="44" y="8" width="12" height="26" rx="3" transform="rotate(180 50 50)" />
    <rect x="44" y="8" width="12" height="26" rx="3" transform="rotate(240 50 50)" />
    <rect x="44" y="8" width="12" height="26" rx="3" transform="rotate(300 50 50)" />

    <!-- 齿轮主体圆圈变小：r="18" -->
    <circle cx="50" cy="50" r="18" />
  </g>
</svg>